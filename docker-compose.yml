version: '3.8'

services:
  spaceguard-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spaceguard-app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./spaceguard.db
      - CORS_ORIGINS=["http://localhost:8000","http://127.0.0.1:8000","http://localhost:5173"]
    volumes:
      - ./uploads:/app/uploads
      - ./reports:/app/reports
    restart: unless-stopped
